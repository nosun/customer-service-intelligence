services:
  n8n:
    image: n8nio/n8n:1.116.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-168}
      DB_SQLITE_POOL_SIZE: "2"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Shanghai}
      TZ: ${GENERIC_TIMEZONE:-Asia/Shanghai}
      LARAVEL_INTERNAL_BASE_URL: ${LARAVEL_INTERNAL_BASE_URL:-http://host.docker.internal:8000/api/internal/n8n}
      LARAVEL_INTERNAL_API_TOKEN: ${LARAVEL_INTERNAL_API_TOKEN}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN}
      PRODUCT_QUESTION_SITE_KEY: ${PRODUCT_QUESTION_SITE_KEY}
      PRODUCT_QUESTION_EXTERNAL_ID: ${PRODUCT_QUESTION_EXTERNAL_ID:-0}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
